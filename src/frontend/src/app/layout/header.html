<header class="flex h-16 items-center gap-3 border-b border-gray-200 bg-white px-4">
  <button
    type="button"
    (click)="menuToggle.emit()"
    class="rounded-lg p-2 text-gray-600 hover:bg-gray-100 lg:hidden"
    aria-label="Abrir menú"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-6 w-6"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
    >
      <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>

  <div class="min-w-0 flex-1">
    <p class="truncate text-sm font-semibold text-gray-900">{{ fullName() }}</p>
    <p class="text-xs text-gray-500">{{ role() }}</p>
  </div>

  <button
    type="button"
    (click)="logout.emit()"
    class="rounded-lg border border-gray-300 px-3 py-1.5 text-sm font-medium text-gray-700 transition hover:bg-gray-100"
  >
    Salir
  </button>
</header>
