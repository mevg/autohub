<div class="flex flex-col gap-3 sm:flex-row">
  <label class="relative flex-1">
    <span class="sr-only">Buscar vehículos</span>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="pointer-events-none absolute left-3 top-1/2 h-5 w-5 -translate-y-1/2 text-gray-400"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
    >
      <path stroke-linecap="round" d="M21 21l-4.3-4.3M10 17a7 7 0 1 0 0-14 7 7 0 0 0 0 14Z" />
    </svg>
    <input
      type="search"
      placeholder="Buscar por marca, modelo o VIN…"
      [ngModel]="search()"
      (ngModelChange)="changed.emit({ search: $event, status: status() })"
      class="w-full rounded-xl border border-gray-300 bg-white py-2.5 pl-10 pr-3 text-sm outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/30"
    />
  </label>

  <select
    [ngModel]="status()"
    (ngModelChange)="changed.emit({ search: search(), status: $event })"
    aria-label="Filtrar por estado"
    class="rounded-xl border border-gray-300 bg-white px-3 py-2.5 text-sm outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/30"
  >
    <option value="">Todos los estados</option>
    @for (s of statuses; track s) {
      <option [value]="s">{{ labels[s] }}</option>
    }
  </select>
</div>
