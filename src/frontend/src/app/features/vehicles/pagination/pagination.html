@if (totalPages() > 1) {
  <nav class="flex items-center justify-center gap-2 pt-2" aria-label="Paginación">
    <button
      type="button"
      [disabled]="page() <= 1"
      (click)="pageChange.emit(page() - 1)"
      class="rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-sm font-medium text-gray-700 transition hover:bg-gray-100 disabled:cursor-not-allowed disabled:opacity-40"
    >
      ← Anterior
    </button>
    <span class="text-sm text-gray-600" aria-live="polite">
      Página {{ page() }} de {{ totalPages() }} · {{ totalCount() }} vehículos
    </span>
    <button
      type="button"
      [disabled]="page() >= totalPages()"
      (click)="pageChange.emit(page() + 1)"
      class="rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-sm font-medium text-gray-700 transition hover:bg-gray-100 disabled:cursor-not-allowed disabled:opacity-40"
    >
      Siguiente →
    </button>
  </nav>
}
