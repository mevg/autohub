<div class="flex min-h-dvh flex-col bg-gray-50 text-gray-900">
  <header class="sticky top-0 z-20 border-b border-gray-200/80 bg-white/90 backdrop-blur">
    <div class="mx-auto flex h-16 w-full max-w-6xl items-center gap-3 px-4 sm:px-6">
      <a routerLink="/" class="flex min-w-0 items-center gap-2">
        @if (branding().logoUrl) {
          <img
            [src]="branding().logoUrl"
            [alt]="branding().appName"
            class="h-9 w-9 object-contain"
          />
        } @else {
          <span
            aria-hidden="true"
            class="flex h-9 w-9 items-center justify-center rounded-xl bg-primary text-lg font-black text-gray-900"
          >
            {{ branding().appName.slice(0, 1) }}
          </span>
        }
        <span class="truncate text-lg font-extrabold tracking-tight">
          {{ branding().appName }}
        </span>
      </a>

      <nav class="ml-auto flex items-center gap-1 text-sm font-medium">
        <a
          routerLink="/"
          class="rounded-lg px-3 py-2 text-gray-600 transition hover:bg-gray-100 hover:text-gray-900"
        >
          Catálogo
        </a>
        <a
          routerLink="/login"
          class="rounded-lg border border-gray-300 px-3 py-2 text-gray-700 transition hover:bg-gray-100"
        >
          Acceso admin
        </a>
      </nav>
    </div>
  </header>

  <main class="flex-1">
    <router-outlet />
  </main>

  <footer class="border-t border-gray-200 bg-white">
    <div
      class="mx-auto flex w-full max-w-6xl flex-col gap-1 px-4 py-6 text-xs text-gray-500 sm:flex-row sm:items-center sm:justify-between sm:px-6"
    >
      <p>© {{ year }} {{ branding().appName }}. Todos los derechos reservados.</p>
      <p>Los precios están expresados en pesos mexicanos (MXN).</p>
    </div>
  </footer>
</div>
