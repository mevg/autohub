<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-3" novalidate>
  @if (success()) {
    <p role="status" class="rounded-xl bg-green-50 px-4 py-3 text-sm font-medium text-green-800">
      ¡Gracias! Recibimos tus datos. El equipo de ventas te contactará pronto.
    </p>
  }

  @if (error()) {
    <p role="alert" class="rounded-xl bg-red-50 px-4 py-3 text-sm font-medium text-red-700">
      {{ error() }}
    </p>
  }

  <div class="grid gap-3 sm:grid-cols-2">
    <label class="flex flex-col gap-1 text-sm font-medium text-gray-700">
      Nombre
      <input
        type="text"
        formControlName="name"
        autocomplete="name"
        placeholder="Tu nombre"
        [class.border-danger]="showError('name')"
        class="rounded-xl border border-gray-300 px-3 py-2.5 text-sm font-normal outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/30"
      />
      @if (showError('name')) {
        <span class="text-xs font-normal text-red-700">
          @if (form.controls.name.hasError('required')) {
            El nombre es requerido.
          } @else {
            El nombre debe tener entre 2 y 100 caracteres.
          }
        </span>
      }
    </label>

    <label class="flex flex-col gap-1 text-sm font-medium text-gray-700">
      Teléfono
      <input
        type="tel"
        formControlName="phone"
        autocomplete="tel"
        placeholder="10 dígitos"
        [class.border-danger]="showError('phone')"
        class="rounded-xl border border-gray-300 px-3 py-2.5 text-sm font-normal outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/30"
      />
      @if (showError('phone')) {
        <span class="text-xs font-normal text-red-700">
          Ingresa un teléfono válido de 10 a 15 dígitos.
        </span>
      }
    </label>
  </div>

  <label class="flex flex-col gap-1 text-sm font-medium text-gray-700">
    Correo electrónico
    <input
      type="email"
      formControlName="email"
      autocomplete="email"
      placeholder="tu@correo.com"
      [class.border-danger]="showError('email')"
      class="rounded-xl border border-gray-300 px-3 py-2.5 text-sm font-normal outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/30"
    />
    @if (showError('email')) {
      <span class="text-xs font-normal text-red-700">Ingresa un correo válido.</span>
    }
  </label>

  <label class="flex flex-col gap-1 text-sm font-medium text-gray-700">
    Mensaje (opcional)
    <textarea
      formControlName="message"
      rows="3"
      maxlength="1000"
      placeholder="Cuéntanos qué te interesa del vehículo…"
      [class.border-danger]="showError('message')"
      class="resize-none rounded-xl border border-gray-300 px-3 py-2.5 text-sm font-normal outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/30"
    ></textarea>
    @if (showError('message')) {
      <span class="text-xs font-normal text-red-700"
        >El mensaje no puede superar 1000 caracteres.</span
      >
    }
  </label>

  <div class="absolute -left-[9999px] top-auto h-px w-px overflow-hidden" aria-hidden="true">
    <label>
      No completar este campo
      <input type="text" formControlName="website" tabindex="-1" autocomplete="off" />
    </label>
  </div>

  <button
    type="submit"
    [disabled]="pending()"
    class="w-full rounded-xl bg-primary px-4 py-3 text-sm font-bold text-gray-900 transition hover:bg-primary-dark disabled:cursor-not-allowed disabled:opacity-60"
  >
    {{ pending() ? 'Enviando…' : 'Solicitar información' }}
  </button>

  <p class="text-center text-[11px] leading-relaxed text-gray-500">
    Usaremos tus datos únicamente para responder a tu solicitud. No compartimos tu información con
    terceros.
  </p>
</form>
