<form
  [formGroup]="form()"
  (ngSubmit)="form().valid && !pending() && submitted.emit(form().getRawValue())"
  class="flex flex-col gap-4"
  novalidate
>
  <label class="flex flex-col gap-1 text-sm font-medium text-gray-700">
    Correo electrónico
    <input
      type="email"
      formControlName="email"
      autocomplete="username"
      placeholder="admin@autohub.local"
      class="rounded-lg border border-gray-300 px-3 py-2 outline-none focus:border-primary focus:ring-2 focus:ring-primary/30"
    />
  </label>

  <label class="flex flex-col gap-1 text-sm font-medium text-gray-700">
    Contraseña
    <span class="relative block">
      <input
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        autocomplete="current-password"
        placeholder="••••••••"
        class="w-full rounded-lg border border-gray-300 px-3 py-2 pr-11 outline-none focus:border-primary focus:ring-2 focus:ring-primary/30"
      />
      <button
        type="button"
        (click)="togglePassword()"
        [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        [attr.aria-pressed]="showPassword()"
        class="absolute inset-y-0 right-0 px-3 text-gray-500 transition hover:text-gray-800"
      >
        @if (showPassword()) {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3 3l18 18M10.5 5.2A9.8 9.8 0 0 1 12 5c7 0 10 7 10 7a17 17 0 0 1-2.9 3.1M6.6 6.6A16.6 16.6 0 0 0 2 12s3 7 10 7a9.6 9.6 0 0 0 4.4-1.1M9.9 9.9a3 3 0 0 0 4.2 4.2"
            />
          </svg>
        } @else {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Zm10 3a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"
            />
          </svg>
        }
      </button>
    </span>
  </label>

  @if (error()) {
    <p role="alert" class="rounded-lg bg-danger/10 px-3 py-2 text-sm font-medium text-danger">
      {{ error() }}
    </p>
  }

  <button
    type="submit"
    [disabled]="form().invalid || pending()"
    class="rounded-lg bg-primary px-4 py-2 font-semibold text-white transition hover:bg-primary-dark disabled:cursor-not-allowed disabled:opacity-50"
  >
    @if (pending()) {
      Ingresando…
    } @else {
      Ingresar
    }
  </button>
</form>
