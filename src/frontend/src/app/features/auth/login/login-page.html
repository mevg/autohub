<div class="flex min-h-dvh items-center justify-center bg-gray-50 px-4">
  <div class="w-full max-w-sm rounded-2xl bg-white p-6 shadow-lg">
    <div class="mb-6 flex items-center gap-3">
      @if (branding().logoUrl) {
        <img
          [src]="branding().logoUrl"
          [alt]="branding().appName"
          class="h-10 w-10 object-contain"
        />
      } @else {
        <span
          class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary text-xl font-bold text-white"
        >
          {{ branding().appName.slice(0, 1) }}
        </span>
      }
      <h1 class="text-xl font-bold text-gray-900">{{ branding().appName }}</h1>
    </div>

    <app-login-form
      [form]="form"
      [pending]="pending()"
      [error]="error()"
      (submitted)="onSubmit($event)"
    />
  </div>
</div>
