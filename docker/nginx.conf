# Frontend AutoHub: sirve la SPA y proxyea al backend las rutas que usan
# URLs relativas (/api, /vehicles, /branding). Sin esto el navegador pediría
# los assets al propio nginx y darían 404 (mismo caso que el proxy.conf en dev).
server {
  listen 80;

  # Subidas de hasta 5 MB + margen de multipart.
  client_max_body_size 10m;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /vehicles/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /branding/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: cualquier otra ruta sirve index.html para el router de Angular.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
